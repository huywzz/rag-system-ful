[project]
name = "rag-system"
version = "0.1.0"
description = "RAG over enterprise documents with LangChain, Alibaba Qwen and Qdrant"
readme = "README.md"
authors = [
    { name = "Huy Doan", email = "huy.doan.quoc@madison.dev" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.44.2",
    "docx2txt>=0.9",
    "fastapi>=0.162.5",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.4",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
